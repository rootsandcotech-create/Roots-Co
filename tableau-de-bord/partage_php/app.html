<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tableau de bord ROOTS</title>
<style>
@font-face{font-family:M;src:url(m.woff2);font-weight:200 800}
:root{--navy:#0c2848;--cy:#22c3e6;--bl:#2563eb;--ink:#24374f;--mut:#6f819b;--line:#dbe6f3;--bg:#f4f8fc;--ok:#1f8a4c;--okb:#e6f5ec;--wa:#9a6a00;--wab:#fff3d6;--er:#c0392b;--erb:#fdeaea}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:M,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#0c2848,#12355f);display:grid;place-items:center;z-index:50}#gate .b{background:#fff;border-radius:18px;padding:30px 34px;width:min(420px,92vw)}#gate img{height:34px;margin-bottom:16px}#gate h2{color:var(--navy);font-size:20px}#gate p{color:var(--mut);font-size:13px;margin:6px 0 14px}#gate input{width:100%;font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px}#gate button{width:100%;font:inherit;font-weight:700;padding:11px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--cy),var(--bl));color:#fff;cursor:pointer}#gate .e{color:var(--er);font-size:12.5px;min-height:18px;margin-top:8px}
#app{display:none;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--navy);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .lg{background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:14px}aside .lg img{height:30px;display:block}
aside button{all:unset;cursor:pointer;display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:600;color:#c9d9ee}
aside button:hover{background:rgba(255,255,255,.08)}aside button.on{background:linear-gradient(90deg,var(--cy),var(--bl));color:#fff}aside svg{width:18px;height:18px;flex:none}
aside .ft{margin-top:auto;font-size:11px;color:#8fa8c8;line-height:1.5;padding:0 8px}
main{padding:26px 32px 50px;min-width:0}h1{font-size:26px;letter-spacing:-.03em;color:var(--navy)}.sub{color:var(--mut);font-size:14px;margin:4px 0 18px}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.3fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}.card h3{font-size:14px;color:var(--navy);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.kpi .n{font-size:34px;font-weight:800;letter-spacing:-.04em;color:var(--navy);line-height:1}.kpi .l{font-size:12.5px;color:var(--mut);margin-top:6px}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:#eaf2fb;color:#2c5d96;white-space:nowrap}.chip.ok{background:var(--okb);color:var(--ok)}.chip.wa{background:var(--wab);color:var(--wa)}.chip.er{background:var(--erb);color:var(--er)}.chip.dk{background:var(--navy);color:#fff}
.alert{background:linear-gradient(90deg,#fff3d6,#fff);border:1px solid #f0d58c;border-radius:14px;padding:14px 18px;margin-bottom:14px}.alert.red{background:linear-gradient(90deg,#fdeaea,#fff);border-color:#f2b9b4}.alert b{color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:9px 10px;border-bottom:1px solid #edf2f8;vertical-align:middle}
tr.pr{cursor:pointer}tr:hover td{background:#f4f9fe}.th{width:58px;height:58px;border-radius:9px;object-fit:cover;background:#e8f0f8;display:grid;place-items:center;font-size:11px;font-weight:800;color:#2c5d96;flex:none}
.pb{height:8px;background:#e8f0f8;border-radius:5px;overflow:hidden;min-width:90px}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--bl))}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}select,input[type=search]{font:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.btn{font:inherit;font-size:12px;font-weight:700;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.g{background:var(--ok);color:#fff;border-color:var(--ok)}.btn:hover{border-color:var(--cy)}
.row{display:flex;gap:12px;align-items:center}.mut{color:var(--mut);font-size:12px}.sec{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #edf2f8;align-items:start}.sec:last-child{border:0}
section{display:none}section.on{display:block}.mono{font-family:Consolas,monospace;font-size:11.5px;color:var(--mut)}
details{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}summary{cursor:pointer;list-style:none;padding:13px 16px;display:grid;grid-template-columns:1.2fr 110px 150px 110px;gap:12px;align-items:center}summary::-webkit-details-marker{display:none}details[open] summary{border-bottom:1px solid var(--line)}
.det{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.obj{padding:8px 0;border-bottom:1px solid #edf2f8;font-size:13px}.obj:last-child{border:0}.td{display:grid;grid-template-columns:60px 1fr 90px;gap:10px;padding:7px 0;border-bottom:1px solid #edf2f8;font-size:13px;align-items:center}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:#fff;box-shadow:-12px 0 40px rgba(12,40,72,.22);transform:translateX(105%);transition:transform .22s;z-index:40;display:flex;flex-direction:column}#dr.on{transform:none}
#dr .hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}#dr .bd{padding:18px 20px;overflow:auto;flex:1}#dr .ft2{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
#dr img.big{width:100%;max-height:360px;object-fit:contain;background:#eef4fa;border-radius:12px}.tx{white-space:pre-wrap;font-size:13.5px;line-height:1.55;background:#f7fafd;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:6px}
.fiche{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px;margin-top:6px}.fiche b{color:var(--mut);font-weight:600}.ck{display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0}
#ov2{position:fixed;inset:0;background:rgba(12,40,72,.35);z-index:39;display:none}#ov2.on{display:block}
@media(max-width:1000px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.k4,.g2,.g3,.det{grid-template-columns:1fr 1fr}summary{grid-template-columns:1fr}}
</style></head><body>
<div id="gate"><div class="b"><img src="logo.png" alt="ROOTS"><h2>Tableau de bord ROOTS</h2><p>Accès réservé à l'équipe. Entrez le mot de passe partagé pour déchiffrer les données.</p><input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password"><button id="go">Ouvrir</button><div class="e" id="er"></div></div></div>
<div id="app"><aside><div class="lg"><img src="logo.png" alt="ROOTS"></div><div id="nav"></div><div class="ft" id="ftx"></div></aside>
<main><section id="s0" class="on"></section><section id="s1"></section><section id="s2"></section><section id="s3"></section><section id="s4"></section><section id="s5"></section><section id="s6"></section><section id="s7"></section></main></div>
<div id="ov2"></div><div id="dr"></div>
<!--SRV--><script>
const SRV=window.__SRV||null;const PAYLOAD="";let D=SRV?SRV.data:null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const raw=b64(PAYLOAD),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct);return JSON.parse(new TextDecoder().decode(pt))}
async function tryOpen(pw,silent){try{D=await unlock(pw);try{sessionStorage.setItem('rd_pw',pw)}catch(e){}document.getElementById('gate').style.display='none';document.getElementById('app').style.display='grid';start()}catch(e){if(!silent)document.getElementById('er').textContent='Mot de passe incorrect.'}}
document.getElementById('go').onclick=()=>tryOpen(document.getElementById('pw').value);document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')tryOpen(e.target.value)};
if(!SRV)try{const p=sessionStorage.getItem('rd_pw');if(p)tryOpen(p,true)}catch(e){}
const IC={ov:'<path d="M3 12 12 3l9 9M5 10v10h14V10"/>',pb:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',pj:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',tk:'<path d="M9 11l3 3 8-8M4 12v7h16v-5"/>',rd:'<circle cx="12" cy="12" r="9"/><path d="M12 12 18 6M12 3v2M3 12h2M21 12h-2"/>',cn:'<path d="M4 6h16M4 12h16M4 18h10"/>',sc:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>',hs:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const TABS=[['ov','Vue d\'ensemble'],['pb','Publications'],['pj','Projets et objectifs'],['tk','Reste à faire'],['rd','Radar d\'événements'],['cn','Canaux'],['sc','Sécurité et pile'],['hs','Historique']];
const LS='rootsdash_v2';let S={st:{},hist:[],ck:{}};try{S=Object.assign(S,JSON.parse(localStorage.getItem(LS))||{})}catch(e){}
const nz=x=>Array.isArray(x)?{}:(x||{});function setS(s){S={st:nz(s.st),hist:s.hist||[],ck:nz(s.ck)}}if(SRV)setS(SRV.state);
async function api(b){try{const r=await fetch('api.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF':SRV.csrf},body:JSON.stringify(b)});if(r.status===401){location.reload();return}const j=await r.json();if(j.state)setS(j.state);if(j.error)alert(j.error);return j}catch(e){alert('Connexion impossible : le changement n\'a pas été enregistré.')}}
const save=()=>{if(SRV)return;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const ts=p=>Date.parse(p.date+'T'+p.heure+':00Z');const stat=p=>(S.st[p.id]&&S.st[p.id].s)||p.statut;const hleft=p=>(ts(p)-Date.now())/36e5;
const fr=d=>new Date(d+'T00:00:00Z').toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});
const cls=s=>({'Fait':'ok','Validé':'ok','Publié':'ok','Atteint':'ok','En cours':'','À faire':'wa','À décider':'wa','À refaire':'er','En attente':'wa','En attente de validation':'wa','Plus tard':'','Anticipé':'','Reporté':'er','À fixer':'wa','À mesurer':'wa','Cible à fixer':'wa'}[s]||'');
function alertOf(p){const s=stat(p);if(s==='Validé'||s==='Publié')return null;const h=hleft(p);if(h<0)return['er','En retard'];if(h<=24)return['er','Moins de 24 h'];if(h<=48)return['wa','À valider (48 h)'];return null}
const E=id=>document.getElementById(id);let CUR=+(new URLSearchParams(location.search).get('tab')||0),F={canal:'',statut:'',q:'',alerte:''},LIST=[];
const ABB={Facebook:'FB',Instagram:'IG',LinkedIn:'LI'};window.ph_=c=>'<div class="th">'+(ABB[c]||'?')+'</div>';
const thumb=p=>p.img?'<img class="th" src="'+p.img+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=ph_(\''+p.canal+'\')">':ph_(p.canal);
function start(){E('ftx').innerHTML='Tableau de bord de pilotage ROOTS &amp; Co.<br>Données du '+D.maj+'.<br>Modèle du futur tableau de bord Fil Infos.'+(SRV?'<br>Connecté : '+SRV.user+' ('+SRV.role+')<br><a href="index.php?logout=1" style="color:#8fe9ff">Déconnexion</a>'+(SRV.role==='admin'?' · <a href="equipe.php" style="color:#8fe9ff">Équipe</a>':''):'');go()}
function nav(){E('nav').innerHTML=TABS.map((t,i)=>'<button data-i="'+i+'" class="'+(i===CUR?'on':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+IC[t[0]]+'</svg>'+t[1]+'</button>').join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{CUR=+b.dataset.i;go()})}
function go(){document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('on',i===CUR));nav();render()}
function render(){[ov,pb,pj,tk,rd,cn,sc,hs][CUR]()}
function setStatus(id,s){const p=D.posts.find(x=>x.id===id);if(SRV){api({a:'status',id,s,titre:p.titre,canal:p.canal}).then(()=>{render();if(DR===id)openPost(id)});return}const old=stat(p);S.st[id]={s,at:new Date().toISOString()};S.hist.unshift({id,titre:p.titre,canal:p.canal,de:old,a:s,at:new Date().toISOString()});save();render();if(DR===id)openPost(id)}
/* ---------- fiche publication ---------- */
let DR=null;
function openPost(id){DR=id;const p=D.posts.find(x=>x.id===id);const i=LIST.findIndex(x=>x.id===id);const a=alertOf(p);const proj=D.proj.find(x=>x[0]===p.projet);
const tags=(p.texte.match(/#\w+/g)||[]).join(' ');const ck=S.ck[id]||{};const CK=['Texte relu','Visuel conforme','Numéro WhatsApp et liens vérifiés','Heure de départ confirmée'];
E('dr').innerHTML='<div class="hd"><div><div class="row" style="margin-bottom:6px"><span class="chip dk">'+p.canal+'</span><span class="chip '+cls(stat(p))+'">'+stat(p)+'</span>'+(a?'<span class="chip '+a[0]+'">'+a[1]+'</span>':'')+'</div><b style="font-size:17px;color:var(--navy)">'+p.titre+'</b><div class="mut" style="margin-top:3px">'+fr(p.date)+' à '+p.heure+' · '+p.id+'</div></div><button class="btn" onclick="closeDr()">Fermer</button></div>'+
'<div class="bd">'+(p.img?'<img class="big" src="'+p.img+'" alt="Affiche" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<div class=\\\'tx\\\'>Affiche non disponible hors ligne : '+p.visuel.replace(/\\/g,'/')+'</div>\'">':'')+
'<div class="row" style="justify-content:space-between;margin-top:16px"><b style="color:var(--navy)">Texte à publier</b><button class="btn" id="cp">Copier le texte</button></div><div class="tx" id="txt"></div>'+
(p.cta?'<div style="margin-top:12px"><b style="color:var(--navy);font-size:13px">Question posée à l\'audience</b><div class="tx" style="margin-top:4px">'+p.cta+'</div></div>':'')+
'<div style="margin-top:16px"><b style="color:var(--navy)">Fiche</b><div class="fiche"><b>Projet</b><span>'+(proj?proj[0]+' · '+proj[1]:p.projet)+'</span><b>Objectif</b><span>'+(proj?proj[3]:'')+'</span><b>Type</b><span>'+p.type+'</span><b>Hashtags</b><span>'+(tags||'aucun')+'</span><b>Visuel</b><span class="mono">'+p.visuel.replace(/\\/g,'/')+'</span><b>Source du texte</b><span>'+p.src+'</span>'+(p.note?'<b>Remarque</b><span>'+p.note+'</span>':'')+'</div></div>'+
'<div style="margin-top:16px"><b style="color:var(--navy)">Contrôle avant validation</b>'+CK.map((c,k)=>'<label class="ck"><input type="checkbox" data-k="'+k+'" '+(ck[k]?'checked':'')+'> '+c+'</label>').join('')+'</div>'+
'<div style="margin-top:16px"><b style="color:var(--navy)">Historique de cette publication</b>'+(S.hist.filter(h=>h.id===id).map(h=>'<div class="mut" style="padding:4px 0">'+new Date(h.at).toLocaleString('fr-FR')+' : '+h.de+' vers '+h.a+(h.par?' ('+h.par+')':'')+'</div>').join('')||'<div class="mut" style="padding:4px 0">Aucun changement enregistré.</div>')+'</div></div>'+
'<div class="ft2"><button class="btn" '+(i>0?'':'disabled')+' onclick="openPost(\''+(i>0?LIST[i-1].id:'')+'\')">Précédente</button><button class="btn" '+(i<LIST.length-1?'':'disabled')+' onclick="openPost(\''+(i<LIST.length-1?LIST[i+1].id:'')+'\')">Suivante</button><span style="flex:1"></span><button class="btn g" onclick="setStatus(\''+id+'\',\'Validé\')">Valider</button><button class="btn p" onclick="setStatus(\''+id+'\',\'Publié\')">Marquer publié</button><button class="btn" onclick="setStatus(\''+id+'\',\'Reporté\')">Reporter</button></div>';
E('txt').textContent=p.texte;E('cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(p.texte);E('cp').textContent='Copié'};
document.querySelectorAll('#dr .ck input').forEach(c=>c.onchange=()=>{S.ck[id]=S.ck[id]||{};S.ck[id][c.dataset.k]=c.checked;save();if(SRV)api({a:'check',id,k:c.dataset.k,v:c.checked})});
E('dr').classList.add('on');E('ov2').classList.add('on')}
function closeDr(){DR=null;E('dr').classList.remove('on');E('ov2').classList.remove('on')}E('ov2').onclick=closeDr;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDr();if(DR&&e.key==='ArrowRight'){const i=LIST.findIndex(x=>x.id===DR);if(i<LIST.length-1)openPost(LIST[i+1].id)}if(DR&&e.key==='ArrowLeft'){const i=LIST.findIndex(x=>x.id===DR);if(i>0)openPost(LIST[i-1].id)}});
/* ---------- vues ---------- */
function ov(){const up=D.posts.filter(p=>stat(p)!=='Publié');const al=up.filter(p=>alertOf(p)).sort((a,b)=>ts(a)-ts(b));const avg=Math.round(D.proj.reduce((a,p)=>a+p[6],0)/D.proj.length);LIST=up.sort((a,b)=>ts(a)-ts(b));
E('s0').innerHTML='<h1>Vue d\'ensemble</h1><div class="sub">Publications, projets, objectifs, sécurité : tout ROOTS sur une page. '+new Date().toLocaleDateString('fr-FR',{dateStyle:'full'})+'.</div>'+
(al.length?'<div class="alert'+(al.some(p=>hleft(p)<=24)?' red':'')+'"><b>Alerte unique des 48 heures :</b> '+al.length+' publication(s) à valider avant leur départ. <span class="mut">Un seul mail à 8 h remplace les alertes répétées.</span><div style="margin-top:8px;display:grid;gap:4px">'+al.slice(0,6).map(p=>'<div class="row" style="font-size:13px;cursor:pointer" onclick="openPost(\''+p.id+'\')"><span class="chip '+alertOf(p)[0]+'">'+alertOf(p)[1]+'</span><b>'+p.titre+'</b><span class="mut">'+p.canal+', '+fr(p.date)+' à '+p.heure+'</span></div>').join('')+'</div></div>':'<div class="alert"><b>Aucune publication à valider dans les 48 heures.</b></div>')+
'<div class="grid k4"><div class="card kpi"><div class="n">'+up.length+'</div><div class="l">publications à venir</div></div><div class="card kpi"><div class="n">'+al.length+'</div><div class="l">à valider sous 48 heures</div></div><div class="card kpi"><div class="n">'+avg+' %</div><div class="l">avancement moyen des '+D.proj.length+' projets</div></div><div class="card kpi"><div class="n">'+D.todo.auj.length+'</div><div class="l">priorités du jour</div></div></div>'+
'<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Prochaines publications <button class="btn" onclick="CUR=1;go()">Tout voir</button></h3><table>'+up.slice(0,7).map(p=>'<tr class="pr" onclick="openPost(\''+p.id+'\')"><td style="width:66px">'+thumb(p)+'</td><td><b>'+p.titre+'</b><div class="mut">'+p.canal+', '+fr(p.date)+' à '+p.heure+'</div></td><td>'+(alertOf(p)?'<span class="chip '+alertOf(p)[0]+'">'+alertOf(p)[1]+'</span>':'<span class="chip">'+stat(p)+'</span>')+'</td></tr>').join('')+'</table></div>'+

function pb(){const all=D.posts.slice().sort((a,b)=>ts(a)-ts(b));LIST=all.filter(p=>(!F.canal||p.canal===F.canal)&&(!F.statut||stat(p)===F.statut)&&(!F.q||(p.titre+p.id+p.texte).toLowerCase().includes(F.q.toLowerCase()))&&(!F.alerte||alertOf(p)));
